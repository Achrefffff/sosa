<!doctype html>
<html lang="fr" class="scroll-smooth" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SŌSA — Sauces Soja Sucrées d'Exception | Le twist qui révèle chaque bouchée</title>
    <meta name="description" content="Découvrez SŌSA : la gamme exclusive de sauces soja sucrées aromatisées en format squeeze 125ml. Fabriqué en France, Vegan, 6 saveurs audacieuses pour sublimer sushis, pokés et viandes." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Instant Theme Initialization (defaults to warm/clair) -->
    <script>
      (function() {
        try {
          var t = sessionStorage.getItem('sosa-theme') || 'warm';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'warm');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#d97706] selection:text-white" style="background-color: var(--bg-body); color: var(--text-primary);">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
